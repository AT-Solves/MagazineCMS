apiVersion: v1
kind: Namespace
metadata:
  name: magazineos
---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magazineos-backend
  namespace: magazineos
  labels:
    app: magazineos
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: magazineos
      component: backend
  template:
    metadata:
      labels:
        app: magazineos
        component: backend
    spec:
      serviceAccountName: magazineos
      containers:
      - name: backend
        image: ghcr.io/yourorganization/magazineos-backend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: magazineos-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: magazineos-secrets
              key: db-port
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: magazineos-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: magazineos-secrets
              key: db-password
        - name: DB_NAME
          value: "magazineos"
        - name: REDIS_HOST
          value: "magazineos-redis"
        - name: REDIS_PORT
          value: "6379"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: magazineos-secrets
              key: jwt-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: magazineos-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: magazineos-secrets
              key: aws-secret-access-key
        - name: AWS_S3_BUCKET
          value: "magazineos-media"
        - name: AWS_REGION
          value: "us-east-1"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1001
---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magazineos-frontend
  namespace: magazineos
  labels:
    app: magazineos
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: magazineos
      component: frontend
  template:
    metadata:
      labels:
        app: magazineos
        component: frontend
    spec:
      serviceAccountName: magazineos
      containers:
      - name: frontend
        image: ghcr.io/yourorganization/magazineos-frontend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 101
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magazineos-redis
  namespace: magazineos
  labels:
    app: magazineos
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magazineos
      component: redis
  template:
    metadata:
      labels:
        app: magazineos
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - name: redis
          containerPort: 6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: magazineos-postgres
  namespace: magazineos
  labels:
    app: magazineos
    component: postgres
spec:
  serviceName: magazineos-postgres
  replicas: 1
  selector:
    matchLabels:
      app: magazineos
      component: postgres
  template:
    metadata:
      labels:
        app: magazineos
        component: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: magazineos-secrets
              key: db-password
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_DB
          value: "magazineos"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 5
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 50Gi
---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: magazineos
  namespace: magazineos
