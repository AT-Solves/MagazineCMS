apiVersion: v1
kind: Secret
metadata:
  name: magazineos-secrets
  namespace: magazineos
type: Opaque
stringData:
  # Database
  db-host: "magazineos-postgres"
  db-port: "5432"
  db-username: "postgres"
  db-password: "change-this-in-production"

  # JWT
  jwt-secret: "change-this-very-long-secret-key-in-production"

  # AWS
  aws-access-key-id: "your-aws-access-key"
  aws-secret-access-key: "your-aws-secret-key"

  # Email
  smtp-host: "smtp.gmail.com"
  smtp-port: "587"
  smtp-user: "your-email@gmail.com"
  smtp-password: "your-app-password"

  # External APIs
  openai-api-key: "your-openai-api-key"
  anthropic-api-key: "your-anthropic-api-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: magazineos-config
  namespace: magazineos
data:
  # Application Configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # Features
  FEATURE_AI_CONTENT_GENERATION: "true"
  FEATURE_MULTILINGUAL_SUPPORT: "true"
  FEATURE_ADVANCED_ANALYTICS: "true"
  FEATURE_WEBHOOKS: "true"

  # Compliance
  COPPA_ENABLED: "true"
  GDPR_K_ENABLED: "true"
  CONTENT_MODERATION_THRESHOLD: "0.5"

  # Database
  DB_LOGGING: "false"
  DB_POOL_SIZE: "20"

  # Cache
  REDIS_HOST: "magazineos-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_TTL: "3600"

  # API
  API_PORT: "3000"
  CORS_ORIGIN: "https://app.magazineos.com"
  API_RATE_LIMIT: "100"
  API_TIMEOUT: "30000"

  # AWS
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "magazineos-media"
  AWS_S3_ACL: "private"

  # Monitoring
  ENABLE_HEALTH_CHECK: "true"
  PROMETHEUS_ENABLED: "true"
  SENTRY_ENABLED: "true"
---
# PersistentVolumeClaim for Redis
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: magazineos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
