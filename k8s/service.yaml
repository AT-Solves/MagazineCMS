apiVersion: v1
kind: Service
metadata:
  name: magazineos-backend
  namespace: magazineos
  labels:
    app: magazineos
    component: backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: magazineos
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: magazineos-frontend
  namespace: magazineos
  labels:
    app: magazineos
    component: frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: magazineos
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: magazineos-redis
  namespace: magazineos
  labels:
    app: magazineos
    component: redis
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  selector:
    app: magazineos
    component: redis
---
apiVersion: v1
kind: Service
metadata:
  name: magazineos-postgres
  namespace: magazineos
  labels:
    app: magazineos
    component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
  selector:
    app: magazineos
    component: postgres
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magazineos-ingress
  namespace: magazineos
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  tls:
  - hosts:
    - app.magazineos.com
    - api.magazineos.com
    secretName: magazineos-tls
  rules:
  - host: app.magazineos.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: magazineos-frontend
            port:
              number: 80
  - host: api.magazineos.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: magazineos-backend
            port:
              number: 80
